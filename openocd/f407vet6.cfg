# STM32F407VET6 核心板（外接 ST-Link V2，SWD 4 线：SWDIO/SWCLK/GND/3V3）
source [find interface/stlink.cfg]
transport select swd
source [find target/stm32f4x.cfg]

# NRST 杜邦线连接下 SRST 会超时（实测），固定 none
reset_config none
# 150kHz = 2026-11-18 实测：300kHz 在用户当前杜邦线上 init 失败，150 一次通
# （旧值 300kHz 是 11-17 那套线的稳定值；杜邦线一换就要重实测）
adapter speed 150
